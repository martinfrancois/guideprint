name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # Corepack, which pins pnpm for the step below, ships with Node 24 and not with Node 25.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Validate the Renovate configuration
        # re2 has to build. Without its native binding the validator falls back to JavaScript
        # regular expressions and says regex validation may be inaccurate, which is exactly what
        # the custom managers in renovate.json rely on, and it still exits 0, so nothing here
        # would catch it. The other three are named only because pnpm 12.4 stops the run while
        # any build script is unbuilt. pnpm 12.5 downgraded that to a warning, so once the pin
        # above moves past 12.4 those three can go and only re2 needs to stay.
        run: >-
          pnpm dlx --allow-build=re2 --allow-build=core-js-pure
          --allow-build=dtrace-provider --allow-build=protobufjs
          --package renovate@44.178.1 renovate-config-validator --strict renovate.json
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Repeatability qualification
        run: uv run python tools/visual_regression.py repeatability
      - name: Strict visual regression against the approved baseline
        run: uv run python tools/visual_regression.py check
      - name: Upload the example guide as built on this runner
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-guide
          path: build/visual-regression/candidate/*.pdf
          if-no-files-found: ignore
      - name: Upload the visual regression report and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          path: build/visual-regression
