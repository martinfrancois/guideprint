name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # Corepack, which pins pnpm for the step below, ships with Node 24 and not with Node 25.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate
      - name: Validate the Renovate configuration
        # pnpm refuses to finish while a dependency still has an unbuilt build script, and the
        # Renovate CLI brings four of them. re2 is the one that matters: without its native
        # binding the validator falls back to JavaScript regular expressions and reports that
        # regex validation may be inaccurate, which is exactly what the custom manager in
        # renovate.json depends on. The other three are named only because pnpm stops for them.
        # A Renovate release that adds another such package fails this step and names it.
        run: >-
          pnpm dlx --allow-build=re2 --allow-build=core-js-pure
          --allow-build=dtrace-provider --allow-build=protobufjs
          --package renovate@44.104.0 renovate-config-validator --strict renovate.json
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Repeatability qualification
        run: uv run python tools/visual_regression.py repeatability
      - name: Strict visual regression against the approved baseline
        run: uv run python tools/visual_regression.py check
      - name: Upload the example guide as built on this runner
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-guide
          path: build/visual-regression/candidate/*.pdf
          if-no-files-found: ignore
      - name: Upload the visual regression report and diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression
          path: build/visual-regression
