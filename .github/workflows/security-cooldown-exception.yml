name: Security cooldown exception

# Renovate raises security pull requests without waiting for the 7-day cooldown, but uv applies
# [tool.uv] exclude-newer to every lock, so a fixed version younger than seven days makes
# Renovate's own `uv lock` fail. This adds the exception Renovate writes for pnpm but not yet for
# uv, re-locks, and pushes to the pull request branch. Workaround, see tools/uv_cooldown.py.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  # For a security fix Renovate did not raise, or a transitive one with no pin to diff: run it by
  # hand against the pull request. Only people with write access can dispatch a workflow.
  workflow_dispatch:
    inputs:
      pull-request:
        description: Number of the pull request carrying the security fix
        required: true
        type: number
      packages:
        description: Space-separated name==version fixes to exempt; empty means the pins the pull request changed
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: true

jobs:
  exempt:
    # Renovate authorship plus the label plus the branch topic, so a hand-made pull request that
    # adds a young pin is never exempted on its own. The label alone matched unrelated pull
    # requests elsewhere.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.user.login == 'renovate[bot]'
          && contains(github.event.pull_request.labels.*.name, 'security')
          && endsWith(github.event.pull_request.head.ref, '-vulnerability'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    # Whatever ends up in the pushed commit is written here by uv and tools/uv_cooldown.py, and
    # by nothing else: every uv call passes --no-build, so no code from a package runs, and the App
    # key only reaches the step that creates the token, after the files are final.
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pull-request }}
        run: |
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefName,headRefOid,baseRefOid,url,isCrossRepository > "$RUNNER_TEMP/pr.json"
          jq -e '.state == "OPEN" and (.isCrossRepository | not)' "$RUNNER_TEMP/pr.json" >/dev/null || {
            echo "pull request $NUMBER is not an open pull request from this repository"; exit 1; }
          {
            echo "head-ref=$(jq -r .headRefName "$RUNNER_TEMP/pr.json")"
            echo "head-sha=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")"
            echo "base-sha=$(jq -r .baseRefOid "$RUNNER_TEMP/pr.json")"
            echo "url=$(jq -r .url "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Add exceptions for fixed versions younger than the cooldown
        id: exempt
        env:
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ -n "$PACKAGES" ]; then
            read -r -a fixes <<< "$PACKAGES"
          else
            git show "$BASE_SHA:pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml"
            mapfile -t fixes < <(python3 -I tools/uv_cooldown.py changed-pins "$RUNNER_TEMP/base-pyproject.toml")
          fi
          if [ "${#fixes[@]}" -eq 0 ]; then echo "no fixed versions to exempt"; exit 0; fi
          for fix in "${fixes[@]}"; do
            [[ "$fix" =~ ^[A-Za-z0-9._-]+==[A-Za-z0-9.!+_-]+$ ]] || { echo "not name==version: $fix"; exit 1; }
          done
          printf 'fix: %s\n' "${fixes[@]}"
          python3 -I tools/uv_cooldown.py exempt "${fixes[@]}" --reason "security fix, $PR_URL"
          upgrades=()
          for fix in "${fixes[@]}"; do upgrades+=(--upgrade-package "$fix"); done
          # A fix that ships only as an sdist fails here. Lock it by hand; see the README.
          uv lock --no-build "${upgrades[@]}"
          uv lock --no-build --check
          files=$(git diff --name-only | sort | tr '\n' ' ')
          if [ -z "$files" ]; then echo "nothing to add"; exit 0; fi
          test "$files" = "pyproject.toml uv.lock " || { echo "unexpected files: $files"; exit 1; }
          if python3 -I tools/uv_cooldown.py same-versions <(git show HEAD:uv.lock) uv.lock 2>/dev/null; then
            echo "the exception changes no locked version, refusing"; exit 1
          fi
          git diff --stat
          echo "push=true" >> "$GITHUB_OUTPUT"
      # A push with GITHUB_TOKEN would not start CI on the new commit, so the required check would
      # never report and Renovate would never automerge. The App's token does start it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.exempt.outputs.push
        id: app
        with:
          # GitHub accepts the numeric app ID wherever it takes the client ID when signing the
          # token request, and `app-id`, the input made for it, is deprecated.
          client-id: ${{ vars.COOLDOWN_APP_ID }}
          private-key: ${{ secrets.COOLDOWN_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and push
        if: steps.exempt.outputs.push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # Renovate's gitIgnoredAuthors holds this address, so Renovate keeps managing the branch.
          user_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -q -am "Exempt the security fix from the uv cooldown"
          git show --stat HEAD
          # Not a force push: if the branch moved since the checkout, this fails and the run the
          # move started redoes the work.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
