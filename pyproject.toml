[project]
name = "guideprint"
version = "0.1.0"
description = "Turn a Notesnook markdown export into step-by-step guide PDFs, one for paper and one for the screen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/guideprint/fonts/LICENSE-Inter.txt"]
authors = [{ name = "François Martin" }]
requires-python = ">=3.12"
keywords = ["notesnook", "markdown", "pdf", "typst", "print"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "markdown-it-py==4.2.0",
  "pillow==12.3.0",
  "python-frontmatter==1.3.0",
  "typst==0.15.0",
]

[project.scripts]
guideprint = "guideprint.cli:main"

[project.urls]
Repository = "https://github.com/martinfrancois/guideprint"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pikepdf==10.13.0.post1",
  "pymupdf==1.28.2",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guideprint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF", "PTH"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["frontmatter", "typst", "pymupdf", "pikepdf"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships no type information, so calls into it are untyped.
module = ["tests.*", "visual_regression"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
